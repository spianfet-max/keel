<style>
/*CORE_CSS*/
/* Catalyst: what the next central-bank and data events have done to markets before, and whether today's option price pays for it.
   Order: what is coming → the board (asset × event) → one cell in depth → the implied-vs-history check. Event multiple is drawn in red by strength. */
.app{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
@media (max-width:480px){.app{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}
.next{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:0;border-bottom:1px solid var(--line)}
.ev{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:3px;padding:14px 14px 12px 0;min-width:0;border-top:2px solid transparent}
.ev:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.ev.on{border-top-color:var(--red)}
.ev .d{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.ev .n{font-size:16px;font-weight:400}
.ev .c{font-size:12px;color:var(--mute)}
.ev .c b{color:var(--ink);font-weight:500}
.tag{display:inline-block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border:1px solid var(--line);color:var(--mute);margin-left:6px;vertical-align:2px}
table.board td.m{cursor:pointer;min-width:118px}
table.board td.m:hover{outline:1px solid var(--ink);outline-offset:-1px}
table.board td.m.on{outline:2px solid var(--ink);outline-offset:-2px}
table.board .mv{display:block;font-size:15px}
table.board .mx{display:block;font-size:11.5px;color:var(--ink);opacity:.72}
table.board td .nm{max-width:none;white-space:normal}
table.board th.evh{cursor:pointer}
table.board th.evh.on{color:var(--ink)}
.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px 22px;align-items:end}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld input[type=number]{width:100%}
.fld .u{font-size:12px;color:var(--mute)}
.ex{font-size:11px;color:var(--warn);margin-left:4px}
.verdict{display:inline-block;padding:3px 10px;font-size:13px;border:1px solid var(--ink);font-weight:500}
.verdict.rich{border-color:var(--neg);color:var(--neg)}
.verdict.cheap{border-color:var(--pos);color:var(--pos)}
.say{font-size:15px;line-height:1.55;max-width:78ch;margin:14px 0 0}
.say b{font-weight:500}
.occ td:nth-child(2){font-weight:400}
.sel2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
</style>

<div class="app">
  <header class="top">
    <div class="brand"><h1 data-ja="カタリスト">Catalyst</h1><span data-ja="主要中銀の政策決定と米経済指標が2010年以降に市場をどれだけ動かしたか、そして今のオプションがその動きを織り込んでいるか">What central-bank decisions and US data have done to markets since 2010, and whether today’s options price it</span></div>
    <div class="tright">
      <span class="pill busy" id="status"><i></i></span>
      <button class="btn q" id="refresh" data-ja="更新">Refresh</button>

  </header>
  <div class="banner" id="banner" hidden></div>
  <div class="help" id="how" hidden></div>

  <section class="sec" style="padding-bottom:0;border:0">
    <div class="sh"><h2 data-ja="今後のイベント">Coming up</h2><p id="nextSub"></p></div>
    <div class="next" id="next"></div>
  </section>

  <div class="bar">

    <span class="lbl" id="asof"></span>
  </div>

  <section class="sec">
    <div class="sh"><h2 data-ja="イベントの値動き">Event moves</h2><p id="bSub"></p></div>
    <div class="bar" style="border:0;padding-top:0"><div class="seg" id="grp"><button data-v="cb" data-ja="中央銀行">Central banks</button><button data-v="us" data-ja="米経済指標">US data</button><button data-v="all" data-ja="すべて">All</button></div></div>
    <div class="tw"><table class="board" id="board"></table></div>
  </section>

  <section class="sec two">
    <div style="min-width:0">
      <div class="sh"><h2 id="dT"></h2><p id="dSub"></p></div>
      <svg class="ch" id="bars" height="280"></svg>
      <div class="leg" id="bLeg"></div>
      <p class="say" id="dSay"></p>
    </div>
    <div style="min-width:0">
      <div class="sh"><h2 data-ja="過去の各回">Each occurrence</h2><p id="oSub"></p></div>
      <div class="tw" style="max-height:420px;overflow-y:auto"><table class="occ" id="occ"></table></div>
    </div>
  </section>

  <section class="sec">
    <div class="sh"><h2 id="iT"></h2><p id="iSub"></p></div>
    <div class="calc">
      <div class="fld"><span class="lbl"><span id="ivL"></span><span class="ex" id="ivEx"></span></span><input type="number" id="iv" step="0.1" min="0"><span class="u" id="ivU"></span></div>
      <div class="fld"><span class="lbl" data-ja="満期までの日数（暦日）">Days to expiry (calendar)</span><input type="number" id="dte" step="1" min="2"><span class="u" id="dteU"></span></div>
      <div class="fld"><span class="lbl" data-ja="イベントを除く日々のボラ">Ex-event volatility</span><input type="number" id="bv" step="0.1" min="0"><span class="u" id="bvU"></span></div>
    </div>
    <div class="out kpis" id="iOut" style="margin-top:18px;border-top:1px solid var(--rule)"></div>
    <p class="say" id="iSay"></p>
  </section>
  <p class="note" id="method"></p>
</div>

function method(){

    `<b>手法。</b>2009年12月以降の日次終値。米国債・日本国債の利回りはbp変化（FRB H.15、財務省）。値動きは反応日の前日終値から反応日（「2日間」では翌日）の終値まで。発表時に市場が開いていれば発表日、引け後なら翌営業日を反応日とします。米指標・ECB・英中銀は日経平均と日本国債では翌日、FOMCは欧州と東京で翌日に計測。通常日は9種類すべてのイベントの反応日を除外。イベント日程：FRB・ECB・日銀・英中銀の日程と記録、CPIと雇用統計はBLSの記録、小売売上高・PCE・GDPはALFRED（セントルイス連銀）の公表履歴（年次改定のみの公表は除外）と国勢調査局・BEAの予定。2013年、2018〜19年、2025年、2026年の政府閉鎖による日程変更を含みます。同日の他のニュースも含まれ、古い年は政策環境が異なるため、直近12回・24回と全期間を見比べてください。織り込みの計算は標準的なイベント分散の分解で、スキュー、週末、満期までの他のイベントは考慮していません。過去の記述であり確率ではありません。投資助言ではありません。${LIVE?'データ：Keel（OpenBB経由のYahoo Finance、FRB、財務省）。無料ソースのため遅延の可能性があります。':'<b>合成サンプルであり、市場データではありません。</b>Keelに接続すると実データを表示します。'}`);
}
window.redraw=render;

/* ---------- load ---------- */
async function load(fresh){
  setStatus('busy');
  const r=await keel('api_history',{symbols:A.map(a=>a.s).join(','),interval:'D',start:'2009-12-01'},{fresh});
  if(r.ok&&r.data&&r.data.series&&Object.keys(r.data.series).length){SERIES=r.data.series;LIVE=true;setStatus('live');
    if(r.data.missing&&r.data.missing.length){const b=$('#banner');b.hidden=false;b.innerHTML=`<span>${T('Not loaded: ','未取得：')}${esc(r.data.missing.join(', '))}</span>`}}
  else{SERIES=sample();LIVE=false;setStatus(r.code==='no_mcp'?'sample':'err',r.code,r.message)}
  S.iv=S.bv=S.dte=null;S._ivTouched=false;render();
}
['iv','dte','bv'].forEach(id=>$('#'+id).oninput=e=>{const v=parseFloat(e.target.value);if(!isFinite(v)||v<=0)return;S[id]=id==='dte'?Math.max(2,Math.round(v)):v;if(id==='iv')S._ivTouched=true;implied(analyse(S.asset,S.ev))});
$$('#win button').forEach(b=>b.onclick=()=>{S.win=+b.dataset.v;save();render()});
$$('#look button').forEach(b=>b.onclick=()=>{S.look=+b.dataset.v;save();render()});
$$('#ovl button').forEach(b=>b.onclick=()=>{S.ovl=b.dataset.v;S.iv=null;save();render()});
$$('#grp button').forEach(b=>b.onclick=()=>{S.grp=b.dataset.v;if(!cols().includes(S.ev)){S.ev=cols()[0];S.iv=S.dte=null;S._ivTouched=false}save();render()});
$('#refresh').onclick=()=>load(true);
$('#how').innerHTML=howHtml();
$$('#langSeg button').forEach(b=>b.onclick=()=>{setLang(b.dataset.l);$('#how').innerHTML=howHtml();restatus();render()});
setLang(LANG);
SERIES=sample();render();
load(false);
</script>
