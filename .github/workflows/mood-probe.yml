name: mood-probe
on:
  push:
    branches: [rineichen-data]
    paths: [scripts/mood_probe.py, .github/workflows/mood-probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {ref: fx-close-fix, path: keel-src}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r keel-src/requirements.txt
      - run: python scripts/mood_probe.py || true
      - run: |
          git config user.name "mood-bot"; git config user.email "actions@github.com"
          git pull --rebase origin rineichen-data || true
          rm -rf keel-src; git add data/ || true
          git commit -m "Mood probe results" || exit 0
          git push
