name: mood-snapshot
on:
  push:
    branches: [rineichen-data]
    paths: [scripts/mood_snapshot.py]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  snap:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {ref: main, path: keel-src}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests yfinance pandas numpy httpx openpyxl xlrd
      - run: python scripts/mood_snapshot.py || true
      - run: |
          rm -rf keel-src
          git config user.name "mood-bot"; git config user.email "actions@github.com"
          git pull --rebase origin rineichen-data || true
          git add data/ || true
          git commit -m "Mood data snapshot" || exit 0
          git push
