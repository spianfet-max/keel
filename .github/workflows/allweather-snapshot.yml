name: allweather-snapshot
on:
  push:
    branches: [rineichen-data]
    paths: [scripts/allweather_snapshot.py, .github/workflows/allweather-snapshot.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  snap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests yfinance pandas
      - run: python scripts/allweather_snapshot.py || true
      - run: |
          git config user.name "allweather-bot"; git config user.email "actions@github.com"
          git pull --rebase origin rineichen-data || true
          git add data/ || true
          git commit -m "AllWeather data snapshot" || exit 0
          git push
